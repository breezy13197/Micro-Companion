# Runs the browser tests in browser-tests/ on every pull request, and again
# whenever something is merged into main.
#
# All five browser projects must pass. Each one is its own check on the pull
# request; make them required under Settings -> Branches so a red one blocks
# the merge.
name: Browser tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.project }}
    # Pinned so the machine does not change underneath the tests when GitHub moves
    # "ubuntu-latest" to Ubuntu 26.04. Move to ubuntu-26.04 once the tests pass there.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium,      browser: chromium }
          - { project: firefox,       browser: firefox }
          - { project: webkit,        browser: webkit }
          - { project: mobile-chrome, browser: chromium }
          - { project: mobile-safari, browser: webkit }
    defaults:
      run:
        working-directory: browser-tests
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - name: Install the test tool
        run: npm ci
      - name: Install the browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Run the tests
        run: npx playwright test --project=${{ matrix.project }}
      - name: Keep the report if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: report-${{ matrix.project }}
          path: |
            browser-tests/playwright-report
            browser-tests/failures-summary.txt
          retention-days: 14
