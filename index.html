/* Builds a practice round from flagged questions only. This deliberately
   ignores the 100% unlock gate: a question can only be flagged after the
   student has already answered it in a graded quiz, so re-practicing it
   gives away nothing they have not already seen and completed. */
function startFlaggedPractice(flags){
  var items = [];
  flags.forEach(function(f){
    var q = findQuestion(f.topic, f.id);
    if(q) items.push({ q:q, topic:f.topic });
  });
  if(!items.length){ toast("None of these questions are available to practice."); return; }
  EXAM.items = shuffle(items);
  EXAM.targets = [];
  EXAM.picks = EXAM.items.map(function(){ return null; });
  EXAM.flags = EXAM.items.map(function(){ return false; });
  EXAM.orders = EXAM.items.map(function(x){ return shuffle(x.q.options.map(function(_,i){ return i; })); });
  EXAM.i = 0;
  EXAM.mode = "flagged";
  EXAM.live = true;
  EXAM.endsAt = null;
  if(EXAM.tick){ clearInterval(EXAM.tick); EXAM.tick = null; }
  renderExam();
}

  var attempts = H.history.slice().reverse();

    stats.appendChild(el("div",{class:"stat"},[ el("div",{class:"k", text:p[0]}), el("div",{class:"v", text:String(p[1])}) ]));
  });
  M.appendChild(stats);

  M.appendChild(el("div",{class:"secthead"},[
    el("h2",{text:"Every attempt"}),
    el("span",{class:"hint", text:"Newest first. Open one to reread its questions and explanations."})
  ]));

  var card = el("div",{class:"card pad"});
  var list = el("div",{class:"hist"});
  attempts.forEach(function(a){
    var reviewable = !!(a.items && a.items.length);
    var row = el("div",{class:"histrow"},[
      el("span",{class:"chip" + (a.pct>=80?" ok":a.pct>=60?" warn":" bad"), text:a.pct + "%"}),
      el("span",{class:"hd"},[
        el("div",{style:"font-weight:600", text: attemptLabel(a) + " · " + a.correct + " of " + a.total + " correct"}),
        el("div",{style:"font-size:12.5px;color:var(--ink-soft)", text:
          (a.topics||[]).map(function(t){ return HUB.byId[t] ? (t==="hub" ? "Integration" : HUB.byId[t].title.split(":")[0]) : t; }).join(", ")})
      ]),
      el("span",{class:"hs", text:fmtDate(a.ts)}),
      reviewable
        ? el("button",{class:"btn small", text:"Review", onclick:function(){ openAttempt(a); }})
        : el("span",{class:"chip", text:"summary only"})
    ]);
    list.appendChild(row);
  });
  card.appendChild(list);

  var legacy = H.history.filter(function(a){ return !(a.items && a.items.length); }).length;
  if(legacy){
    card.appendChild(el("div",{class:"note", style:"margin:18px 0 0", text:
      legacy + " earlier attempt" + (legacy===1?"":"s") + " " + (legacy===1?"was":"were") +
      " taken before question-by-question review was added, so only the score is stored for " +
      (legacy===1?"it":"them") + ". Exams from now on are fully re-readable."}));
  }
  M.appendChild(card);
  paintRail();
}

/* Rebuilds a finished attempt from stored ids + picks. Question text and
   rationales come from the banks as they are NOW, so a corrected
   explanation shows its current wording. */
function openAttempt(a){
  var byArea = {}, byTopic = {}, correct = 0, rows = [], missing = 0;
  a.items.forEach(function(rec){
    var q = findQuestion(rec.topic, rec.id);
    if(!q){
      missing++;
      rows.push({ item:{ q:null, id:rec.id, topic:rec.topic }, right:false, pick:rec.pick, flag:rec.flag });
      return;
    }
    var right = (rec.pick === q.answer);
    if(right) correct++;
    var ak = areaKey(rec.topic, q.area || "General");
    if(!byArea[ak]) byArea[ak] = {got:0, total:0, area:q.area || "General", topic:rec.topic};
    byArea[ak].total++; if(right) byArea[ak].got++;
    if(!byTopic[rec.topic]) byTopic[rec.topic] = {got:0, total:0};
    byTopic[rec.topic].total++; if(right) byTopic[rec.topic].got++;
    rows.push({ item:{ q:q, topic:rec.topic }, right:right, pick:rec.pick, flag:rec.flag });
  });
  renderPastAttempt(a, correct, byArea, byTopic, rows, missing);
}

function renderPastAttempt(a, correct, byArea, byTopic, rows, missing){
  var M = $("main"); M.innerHTML = "";
  M.appendChild(el("div",{class:"actions", style:"margin-bottom:16px"},[
    el("button",{class:"btn", text:"← Back to history", onclick:function(){ setView("history"); }})
  ]));

  var hero = el("div",{class:"scorehero"});
  hero.appendChild(el("div",{},[ el("div",{class:"big", text:a.pct + "%"}) ]));
  hero.appendChild(el("div",{style:"flex:1 1 280px"},[
    el("h2",{text: attemptLabel(a) + " · " + a.correct + " of " + a.total + " correct"}),
    el("p",{text:"Taken " + fmtDate(a.ts) + ". The explanations below are the current ones from each question bank."})
  ]));
  M.appendChild(hero);

  if(missing){
    M.appendChild(el("div",{class:"note warn", style:"margin-top:16px", text:
      missing + " question" + (missing===1?"":"s") + " from this attempt " + (missing===1?"is":"are") +
      " no longer in the banks and can't be shown. The score above is the one you actually got at the time."}));
  }

  if(Object.keys(byTopic).length){
    M.appendChild(el("div",{class:"secthead"},[el("h2",{text:"By companion"})]));
    var c1 = el("div",{class:"card pad"});
    var bd1 = el("div",{class:"bd"});
    Object.keys(byTopic).forEach(function(tid){
      var b = byTopic[tid], p = pct(b.got, b.total), t = HUB.byId[tid];
      bd1.appendChild(bdRow(t ? (tid === "hub" ? "Integration & review" : t.title) : tid, p, b.got, b.total, t ? t.accent : null));
    });
    c1.appendChild(bd1); M.appendChild(c1);
  }

  var weakAreas = [];
  if(Object.keys(byArea).length){
    M.appendChild(el("div",{class:"secthead"},[el("h2",{text:"By content area"})]));
    var c2 = el("div",{class:"card pad"});
    var bd2 = el("div",{class:"bd"});
    Object.keys(byArea).forEach(function(k){
      var b = byArea[k], p = pct(b.got, b.total);
      if(p < 100) weakAreas.push(b);
      bd2.appendChild(bdRow(b.area + "  ·  " + (HUB.byId[b.topic] ? HUB.byId[b.topic].title.split(":")[0] : b.topic),
        p, b.got, b.total, null));
    });
    c2.appendChild(bd2); M.appendChild(c2);
  }

  M.appendChild(el("div",{class:"secthead"},[el("h2",{text:"Every question, with the reasoning"})]));
  var c3 = el("div",{class:"card pad"});
  c3.appendChild(reviewListEl(rows));
  M.appendChild(c3);

  var act = el("div",{class:"actions", style:"margin-top:20px"});
  if(weakAreas.length){
    act.appendChild(el("button",{class:"btn primary", text:"Practice these areas again", onclick:function(){
      EXAMSETUP.count = Math.max(8, Math.min(20, weakAreas.length * 4));
      setView("adaptive");
    }}));
  }
  act.appendChild(el("button",{class:"btn", text:"Back to history", onclick:function(){ setView("history"); }}));
  M.appendChild(act);
  paintRail();
}

/* --------------------------------------------------------- BACKUP/RESTORE - */
function renderBackup(){
  var M = shell(TITLES.backup[0], TITLES.backup[1]);
  M.appendChild(el("div",{class:"note", text:
    "Everything you've done lives only in this browser, on this device — that's true of every companion and of the hub itself. " +
    "To keep the same progress when you switch computers or browsers, download a backup file here, then load that exact file on the other device."}));

  /* ---------- section 1: download ---------- */
  var out = el("div",{class:"card pad", style:"margin-bottom:18px"});
  out.appendChild(el("h3",{text:"Download a backup"}));
  out.appendChild(el("p",{class:"lead", text:"This captures your progress in every companion listed below, plus your hub exam history and flashcard marks."}));

  var labelIn = el("input",{type:"text", class:"textin", placeholder:"Name this backup (optional) — e.g. your name",
    "aria-label":"Backup label"});
  out.appendChild(el("div",{style:"margin-bottom:16px"},[labelIn]));

  var progs = allProgress();
  var tb = el("table",{class:"tbl"});
  tb.appendChild(el("tr",{},[el("th",{text:"Companion"}),el("th",{class:"num",text:"Progress that will be saved"})]));
  progs.forEach(function(p){
    tb.appendChild(el("tr",{},[
      el("td",{text:p.topic.title}),
      el("td",{class:"num", text: p.hasManifest ? p.pct+"% ("+p.done+"/"+p.total+")" : (Object.keys(p.state.best).length? "quiz scores only" : "no progress yet")})
    ]));
  });
  tb.appendChild(el("tr",{},[
    el("td",{text:"Hub (exam history, flashcard marks)"}),
    el("td",{class:"num", text: H.history.length + " exam" + (H.history.length===1?"":"s") + " · " + Object.keys(H.cards.known).length + " cards marked known"})
  ]));
  out.appendChild(tb);
  out.appendChild(el("button",{class:"btn primary", style:"margin-top:16px", text:"Download backup file", onclick:function(){
    downloadBackup(labelIn.value);
    toast("Backup downloaded. Keep the file somewhere you can find it on the other device.");
  }}));
  M.appendChild(out);

  /* ---------- section 2: load ---------- */
  var load = el("div",{class:"card pad"});
  load.appendChild(el("h3",{text:"Load a backup"}));
  load.appendChild(el("p",{class:"lead", text:
    "Choose a backup file you downloaded earlier. Nothing is changed yet — you'll see exactly what would happen first."}));

  var fileIn = el("input",{type:"file", accept:".json,application/json", "aria-label":"Choose a backup file"});
  var result = el("div",{style:"margin-top:16px"});
  load.appendChild(fileIn);
  load.appendChild(result);
  M.appendChild(load);

  fileIn.onchange = function(){
    result.innerHTML = "";
    var f = fileIn.files && fileIn.files[0];
    if(!f) return;
    var reader = new FileReader();
    reader.onerror = function(){
      result.appendChild(el("div",{class:"note bad", text:"Couldn't read that file. Try choosing it again."}));
    };
    reader.onload = function(){
      var parsed = parseBackupFile(String(reader.result));
      if(!parsed.ok){
        result.appendChild(el("div",{class:"note bad", text:parsed.error}));
        return;
      }
      renderBackupPreview(result, parsed.payload);
    };
    reader.readAsText(f);
  };
  paintRail();
}

function renderBackupPreview(host, payload){
  host.innerHTML = "";
  var when = "";
  try{ when = new Date(payload.exportedAt).toLocaleString(undefined,{month:"short",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}); }
  catch(e){ when = "unknown date"; }

  host.appendChild(el("div",{class:"note"},[
    el("div",{style:"font-weight:650;margin-bottom:3px", text: payload.label ? "Backup: “"+payload.label+"”" : "Backup file"}),
    el("div",{text:"Made " + when + "."})
  ]));

  var tb = el("table",{class:"tbl"});
  tb.appendChild(el("tr",{},[el("th",{text:"Companion"}),el("th",{class:"num",text:"Currently on this device"}),el("th",{class:"num",text:"In this backup"})]));
  var knownIds = HUB.topics.map(function(t){ return t.id; });
  var backupIds = Object.keys(payload.companions);

  HUB.topics.forEach(function(t){
    if(t.id === "hub") return;
    var live = progressFor(t);
    var liveTxt = live.hasManifest ? live.pct+"%" : (Object.keys(live.state.best).length ? "quiz scores only" : "no progress");
    var row = previewRow(t, payload.companions[t.id]);
    var backTxt = row === null ? "not in this file"
      : row.unreadable ? "unreadable"
      : row.quizOnly ? "quiz scores only"
      : row.pct + "%";
    tb.appendChild(el("tr",{},[
      el("td",{text:t.title}),
      el("td",{class:"num", text:liveTxt}),
      el("td",{class:"num", text:backTxt, style: row ? "font-weight:650" : ""})
    ]));
  });
  var liveExams = H.history.length;
  var backExams = (payload.hub && payload.hub.history) ? payload.hub.history.length : 0;
  tb.appendChild(el("tr",{},[
    el("td",{text:"Hub exam history"}),
    el("td",{class:"num", text: liveExams + " exam" + (liveExams===1?"":"s")}),
    el("td",{class:"num", text: backExams + " exam" + (backExams===1?"":"s"), style:"font-weight:650"})
  ]));
  host.appendChild(tb);

  var unknown = backupIds.filter(function(id){ return knownIds.indexOf(id) === -1; });
  if(unknown.length){
    host.appendChild(el("div",{class:"note", style:"margin-top:14px", text:
      "This file also includes " + unknown.length + " companion" + (unknown.length===1?"":"s") + " not currently loaded on this page (" +
      unknown.join(", ") + "). Their progress will be kept and will appear once that companion is added here."}));
  }

  host.appendChild(el("div",{class:"note warn", style:"margin-top:14px"},[
    el("div",{style:"font-weight:650;margin-bottom:3px", text:"Before you load this"}),
    el("div",{text:"Only the companions and hub history shown above will be replaced. Anything else already on this device is left alone. " +
      "If a row above shows this device with MORE progress than the backup, loading it will move that companion backwards."})
  ]));

  var actions = el("div",{class:"actions", style:"margin-top:16px"});
  actions.appendChild(el("button",{class:"btn danger", text:"Replace my progress with this backup", onclick:function(){
    var invalidIds = backupIds.filter(function(id){ return !validateCompanionRaw(payload.companions[id]).ok; });
    var msg = "This will overwrite the progress shown above on this device with what's in the backup file. This can't be undone. Continue?";
    if(invalidIds.length){
      msg = invalidIds.length + " compan" + (invalidIds.length===1?"y":"ies") + " in this file (" + invalidIds.join(", ") +
        ") could not be read and will be left untouched rather than overwriting what's on this device. " + msg;
    }
    if(!confirm(msg)) return;
    applyBackup(payload);
  }}));
  actions.appendChild(el("button",{class:"btn", text:"Cancel", onclick:function(){ host.innerHTML = ""; }}));
  host.appendChild(actions);
}

/* ------------------------------------------------------------------ HELP - */
function renderHelp(){
  var M = shell(TITLES.help[0], TITLES.help[1]);
  var c = el("div",{class:"card pad"});
  c.innerHTML =
    '<h3>What the hub is</h3>'
  + '<p class="lead">The hub sits alongside your study companions. It does not teach anything new on its own; it reads the work you have already done in each companion, shows it in one place, and lets you practice across all of them at once.</p>'
  + '<h3 style="margin-top:22px">Where your progress lives</h3>'
  + '<p class="lead">Everything is stored inside this browser, on this device. Nothing is uploaded and there is no account. Use the same browser each time, and avoid private browsing, or the hub will look empty even though you have done the work. Clearing your browser data clears this too. To carry your progress to a different device or browser, use "Save / load progress" in the sidebar — it downloads a single file you can load back in on the other one.</p>'
  + '<h3 style="margin-top:22px">The dashboard</h3>'
  + '<p class="lead">Each companion counts a section as done when every checkpoint in it has been answered correctly and any activity in it has been submitted, and counts a quiz as done once submitted at any score. The hub applies exactly the same rules, so the percentage here matches the ring inside the companion itself.</p>'
  + '<h3 style="margin-top:22px">Building an exam</h3>'
  + '<p class="lead">Pick which companions to draw from, how many questions, and whether to run a clock. A timed paper submits itself when time runs out. Questions and their answer choices are reshuffled every time, so the same settings never produce the same paper twice.</p>'
  + '<p class="lead">The draw is random, but it is not a pure lottery: every concept area in the companions you picked gets one question before any area gets a second, so no topic is skipped by chance. If you ask for fewer questions than there are concept areas, the hub takes areas from each companion in turn, so every companion is represented before any one of them gets a second area. The setup screen tells you how many areas your exam covers. The remaining questions are filled in at random, favoring the areas with the fewest questions so far.</p>'
  + '<h3 style="margin-top:22px">The adaptive review</h3>'
  + '<p class="lead">This builds a set aimed at your weak spots rather than a random one. It looks at how you answered each concept area: your answers in hub exams, and your answers to every quiz question inside the companions (module quizzes, mastery exams, and practice rounds). Areas with the largest gap get the most questions, and it prefers questions you have not met before. A section you simply have not studied yet is not counted as a weakness.</p>'
  + '<h3 style="margin-top:22px">The hub question bank</h3>'
  + '<p class="lead">Alongside the companion banks there is a bank belonging to the hub itself, listed as "Integration &amp; review". Every question in it deliberately draws on two or more Bacteria companions at once, for example a drug from Bacteria II together with the organism it treats from Bacteria III or IV. Those questions appear nowhere inside a companion. After a miss, the results page points you back to the companions the question drew on.</p>'
  + '<h3 style="margin-top:22px">Why some companions are locked</h3>'
  + '<p class="lead">A companion’s own questions only become available for hub exams and adaptive review once that companion reaches 100% — the same figure shown on its progress ring. Below 100%, sitting a hub exam on it would let you skip the checkpoints, activities and quizzes that companion is built to walk you through, so the hub keeps its questions out of the pool until that work is actually done. A companion with no manifest file is treated the same way, since the hub has no way to confirm its progress at all. This does not apply to the hub’s own "Integration &amp; review" bank, which is never gated, or to flashcards, which stay open regardless of progress since they are a study aid rather than a graded round.</p>'
  + '<h3 style="margin-top:22px">If a companion is missing from the dashboard</h3>'
  + '<p class="lead">The hub loads each bank as a separate file. If one fails to load, a red note appears at the top of the dashboard naming it. That almost always means the file is not in the banks folder next to this page, or its name is spelled differently.</p>';
  M.appendChild(c);

  var c2 = el("div",{class:"card pad", style:"margin-top:16px"});
  c2.appendChild(el("h3",{text:"What is loaded right now"}));
  var tb = el("table",{class:"tbl"});
  tb.appendChild(el("tr",{},[el("th",{text:"Bank"}),el("th",{class:"num",text:"Questions"}),
    el("th",{class:"num",text:"Checkpoints"}),el("th",{class:"num",text:"Cards"}),el("th",{text:"Structure map"}),
    el("th",{text:"Hub exams"})]));
  HUB.topics.forEach(function(t){
    var us = unlockStatus(t.id);
    tb.appendChild(el("tr",{},[
      el("td",{text:t.title}),
      el("td",{class:"num", text:String(t.pool.length)}),
      el("td",{class:"num", text:String(Object.keys(t.checkpoints).length)}),
      el("td",{class:"num", text:String(t.cards.length)}),
      el("td",{}, [el("span",{class:"chip" + (t.manifest ? " ok" : ""), text: t.manifest ? "manifest loaded" : (t.id==="hub" ? "not needed" : "missing")})]),
      el("td",{}, [el("span",{class:"chip" + (us.unlocked ? " ok" : " warn"),
        text: us.unlocked ? "unlocked" : (us.pct === null ? "locked" : "locked · " + us.pct + "%")})])
    ]));
  });
  c2.appendChild(tb);
  c2.appendChild(el("div",{class:"actions", style:"margin-top:18px"},[
    el("button",{class:"btn danger", text:"Clear my hub history", onclick:function(){
      if(!confirm("Clear your hub exam history, question history and flashcard marks?\n\nThis does not touch your progress inside the companions themselves.")) return;
      H = blankHub(); saveHub(); toast("Hub history cleared."); setView("dash");
    }})
  ]));
  M.appendChild(c2);
  paintRail();
}

/* =================================================================== BOOT = */
function render(){
  if(VIEW === "dash") renderDash();
  else if(VIEW === "companions") renderCompanions();
  else if(VIEW === "exam") renderExamSetup(false);
  else if(VIEW === "adaptive") renderExamSetup(true);
  else if(VIEW === "cards") renderCards();
  else if(VIEW === "flagged") renderFlagged();
  else if(VIEW === "history") renderHistory();
  else if(VIEW === "backup") renderBackup();
  else renderHelp();
}
window.addEventListener("beforeunload", function(e){
  persistExam();   /* a refresh or closed tab no longer loses the exam */
});
if(!HUB.topics.length){
  $("main").innerHTML = '<div class="card pad"><div class="empty"><strong>No question banks loaded</strong>' +
    '<span>hub.html expects a folder called <code>banks</code> sitting next to it, holding each companion’s ' +
    '<code>.js</code> bank file and its <code>.manifest.js</code> file. None of them were found.</span></div></div>';
} else {
  render();
}
</script>
